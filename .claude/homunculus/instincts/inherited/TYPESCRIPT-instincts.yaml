# TYPESCRIPT Workflow Dependency Upgrade Across Multiple Packages

## Action

Follow the dependency-upgrade-across-multiple-packages workflow:
1. Detect outdated dependencies in multiple project directories.
2. Update package.json with new dependency versions in each affected directory.
3. Update corresponding lock files (package-lock.json, pnpm-lock.yaml) in each directory.
4. Commit all changes together with a detailed changelog.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: **/package.json, **/package-lock.json, **/pnpm-lock.yaml

